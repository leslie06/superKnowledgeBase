server:
  port: 8080

spring:
  application:
    name: superKnowledgeBase
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/skb
    username: skb
    password: skb
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 1GB
  mvc:
    async:
      # 流式回答可能较长
      request-timeout: 5m
  http:
    clients:
      # 同步 HTTP 调用（DeepSeek 非流式调用、Ollama embedding）的读超时，防止连接卡住时请求无限期挂起
      read-timeout: 60s
  ai:
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3

skb:
  storage-dir: ./data/files
  ingestion:
    # 同时处理的文档数，避免压垮本地 embedding 服务
    concurrency: 2
    embedding-batch-size: 16
  chunk:
    target-chars: 600
    max-chars: 1000
    overlap-chars: 100
  ocr:
    # 扫描版 PDF 的文字识别（苹果 Vision，仅 macOS）。需先编译：swiftc -O scripts/ocr/vision_ocr.swift -o scripts/ocr/vision-ocr
    # 命令不存在时跳过识别，扫描页取不到文字。识别结果按文件内容缓存在 ocr_page 表，重新处理时不会重复识别
    enabled: true
    command: scripts/ocr/vision-ocr
    # 渲染成图片的分辨率，扫描书 200 已足够；实测约 0.6~0.9 秒一页
    dpi: 200
    # 文字层少于这么多个字（不含空白，不计每页重复的水印、页眉页脚）的页视为扫描页
    min-page-chars: 20
  retrieval:
    top-k: 6
    # 余弦相似度低于此值、且没有精确命中问题中编号的片段视为不相关（按 scripts/eval 评测结果调整）
    min-score: 0.5
    # 向量、关键词（BM25）两路各召回的候选数，RRF 融合排序后再取 top-k
    candidates: 30
    # RRF 融合：片段得分 = 1 / (rrf-k + 向量排名) + keyword-weight / (rrf-k + 关键词排名)；
    # 精确命中问题中编号的片段始终排在最前。两个值由 scripts/eval 四份题集网格搜索得出
    rrf-k: 10
    keyword-weight: 0.25
    # 查询改写每个问题多一次 DeepSeek 调用（通常 1~2 秒），超过这个时间就放弃改写、用原问题检索
    rewrite-timeout: 10s
    # 向量召回时 HNSW 索引的搜索范围（hnsw.ef_search）。pgvector 默认 40，只比 candidates 多一点：
    # 2.6 万个片段的库里，40 时与精确结果的前 30 名可能一个都不重合；200 时完全一致，耗时仍是毫秒级
    ef-search: 200
  rerank:
    # 交叉编码器精排，需先启动 scripts/rerank_server.py；服务不可用时退回 RRF 排序和上面的 min-score
    enabled: true
    base-url: http://localhost:8081
    # 取 RRF 融合后的前多少个片段精排；评测中正确片段在 RRF 中都排在前 13，延迟与数量成正比
    candidates: 20
    # 精排分数（0~1）阈值，启用精排时取代 retrieval.min-score。精排输入是查询改写后的"原问题 + 术语"，
    # 正确片段的分数整体抬高：按 scripts/eval 六份题集扫描，0.03~0.1 之间问答可用 118/118、拒答 13/19，取 0.05。
    # 不改写时（/search 传 rewrite=false）口语化问题的分数偏低，这个阈值会误伤，当时用的是 0.01
    min-score: 0.05
    timeout: 15s
  chat:
    history-messages: 6
    max-context-chars: 12000
    # 命中片段在同一章节里的前后片段一起交给模型，每条参考资料最多这么多字；答案常常跨片段（列举项、跨页段落），0 表示不扩展
    expand-chars: 1500
