server:
  port: 8080

spring:
  application:
    name: superKnowledgeBase
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/skb
    username: skb
    password: skb
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 1GB
  mvc:
    async:
      # 流式回答可能较长
      request-timeout: 5m
  ai:
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3

skb:
  storage-dir: ./data/files
  ingestion:
    # 同时处理的文档数，避免压垮本地 embedding 服务
    concurrency: 2
    embedding-batch-size: 16
  chunk:
    target-chars: 600
    max-chars: 1000
    overlap-chars: 100
  retrieval:
    top-k: 6
    # 余弦相似度低于此值、且没有精确命中问题中编号的片段视为不相关（按 scripts/eval 评测结果调整）
    min-score: 0.5
    # 向量、关键词（BM25）两路各召回的候选数，RRF 融合排序后再取 top-k
    candidates: 30
    # RRF 融合：片段得分 = 1 / (rrf-k + 向量排名) + keyword-weight / (rrf-k + 关键词排名)；
    # 精确命中问题中编号的片段始终排在最前。两个值由 scripts/eval 四份题集网格搜索得出
    rrf-k: 10
    keyword-weight: 0.25
  rerank:
    # 交叉编码器精排，需先启动 scripts/rerank_server.py；服务不可用时退回 RRF 排序和上面的 min-score
    enabled: true
    base-url: http://localhost:8081
    # 取 RRF 融合后的前多少个片段精排；评测中正确片段在 RRF 中都排在前 13，延迟与数量成正比
    candidates: 20
    # 精排分数（0~1）阈值，启用精排时取代 retrieval.min-score。bge-reranker-v2-m3 对无关片段通常给 0.001 左右；
    # 按 scripts/eval 六份题集扫描，0.01 时问答可用 117/118、拒答 14/19，再提高会误伤口语化问题的正确片段
    min-score: 0.01
    timeout: 15s
  chat:
    history-messages: 6
    max-context-chars: 12000
