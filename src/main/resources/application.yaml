server:
  port: 8080

spring:
  application:
    name: superKnowledgeBase
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/skb
    username: skb
    password: skb
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 1GB
  mvc:
    async:
      # 流式回答可能较长
      request-timeout: 5m
  http:
    clients:
      # 同步 HTTP 调用（DeepSeek 非流式调用、Ollama embedding）的读超时，防止连接卡住时请求无限期挂起
      read-timeout: 60s
  ai:
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: bge-m3

skb:
  storage-dir: ./data/files
  ingestion:
    # 同时处理的文档数，避免压垮本地 embedding 服务
    concurrency: 2
    embedding-batch-size: 16
  chunk:
    target-chars: 600
    max-chars: 1000
    overlap-chars: 100
  ocr:
    # 扫描版 PDF 的文字识别（苹果 Vision，仅 macOS）。需先编译：swiftc -O scripts/ocr/vision_ocr.swift -o scripts/ocr/vision-ocr
    # 命令不存在时跳过识别，扫描页取不到文字。识别结果按文件内容缓存在 ocr_page 表，重新处理时不会重复识别
    enabled: true
    command: scripts/ocr/vision-ocr
    # 渲染成图片的分辨率，扫描书 200 已足够；实测约 0.6~0.9 秒一页
    dpi: 200
    # 文字层少于这么多个字（不含空白，不计每页重复的水印、页眉页脚）的页视为扫描页
    min-page-chars: 20
  summary:
    # 用 DeepSeek 为每个文档生成摘要，作为特殊片段参与检索，回答"这本书讲了什么""哪些资料讲到了 XX"这类问题。
    # 新文档在处理时生成，已有文档在启动时后台补生成；每个文档约 4000 token
    enabled: true
    input-chars: 6000
    # 正文片段少于这个数的短文档不生成摘要片段（正文就是全部内容，摘要只会重复占位）；已有的在启动时清掉
    min-chunks: 5
    # 章节摘要：正文达到 chapter-min-chars 字的章节（第X章 / 第X回 / 第X篇）各生成一段摘要，作为特殊片段参与检索，
    # 回答"第七十九回讲了什么""西门庆死在谁的床上"这类情节问题（答案在某一回里，原文用词和问法对不上）。
    # 文档处理完成后在后台生成，已有文档启动时补生成；每个章节约 8000 token，全库约 850 个章节。
    # 默认关闭：识别出回目后，章节路径已经进了每个片段的向量和关键词索引，点名章节的问题直接读该章原文，先看这样够不够
    chapter-enabled: false
    chapter-min-chars: 3000
    chapter-input-chars: 12000
    chapter-concurrency: 4
  retrieval:
    # 问答时交给模型的片段数。6 个时答案常常恰好排在第 7、第 10（如"西门庆第一个女人是谁"），模型擅长从多给的资料里挑出有用的
    top-k: 10
    # 余弦相似度低于此值、且没有精确命中问题中编号的片段视为不相关（按 scripts/eval 评测结果调整）
    min-score: 0.5
    # 向量、关键词（BM25）两路各召回的候选数，RRF 融合排序后再取 top-k
    candidates: 30
    # RRF 融合：片段得分 = 1 / (rrf-k + 向量排名) + keyword-weight / (rrf-k + 关键词排名)；
    # 精确命中问题中编号的片段始终排在最前。两个值由 scripts/eval 四份题集网格搜索得出
    rrf-k: 10
    keyword-weight: 0.25
    # 查询改写每个问题多一次 DeepSeek 调用（通常 1~2 秒），超过这个时间就放弃改写、用原问题检索
    rewrite-timeout: 10s
    # 向量召回时 HNSW 索引的搜索范围（hnsw.ef_search）。pgvector 默认 40，只比 candidates 多一点：
    # 2.6 万个片段的库里，40 时与精确结果的前 30 名可能一个都不重合；200 时完全一致，耗时仍是毫秒级
    ef-search: 200
    # 汇总类问题（列举、对比、全书分析，如"哪些行为会被直接解除合同""金瓶梅的女性人物形象"）的答案分散在很多片段里，
    # 一次检索的 top-k 覆盖不全：先判断问题类型（与查询改写并行，不增加普通问题的耗时），需要时拆成 2~6 个子问题并行检索，
    # 轮流从各路结果中取片段合并，最多 aggregate-top-k 个；每个子问题只精排 sub-query-rerank-candidates 个以控制耗时
    plan-queries: true
    aggregate-top-k: 12
    sub-query-rerank-candidates: 10
    # 迭代检索：检索后先请 LLM 判断资料够不够回答，不够时换原文可能用的说法补查（"西门庆死在谁的床上"首轮只检索到
    # 生前"床上"的情节，原文写的是"断气身亡""丧命"），最多补查这么多轮；资料够用时只多一次判断调用。0 表示不补查
    max-follow-ups: 1
  rerank:
    # 交叉编码器精排，需先启动 scripts/rerank_server.py；服务不可用时退回 RRF 排序和上面的 min-score
    enabled: true
    base-url: http://localhost:8081
    # 取 RRF 融合后的前多少个片段精排；评测中正确片段在 RRF 中都排在前 13，延迟与数量成正比
    candidates: 20
    # 精排分数（0~1）阈值，启用精排时取代 retrieval.min-score。精排输入是查询改写后的"原问题 + 术语"，
    # 正确片段的分数整体抬高：按 scripts/eval 六份题集扫描，0.03~0.1 之间问答可用 118/118、拒答 13/19，取 0.05。
    # 不改写时（/search 传 rewrite=false）口语化问题的分数偏低，这个阈值会误伤，当时用的是 0.01
    min-score: 0.05
    timeout: 15s
  chat:
    history-messages: 6
    max-context-chars: 18000
    # 命中片段在同一章节里的前后片段一起交给模型，每条参考资料最多这么多字；答案常常跨片段（列举项、跨页段落），0 表示不扩展
    expand-chars: 1500
    # 回答生成后再请 LLM 对照参考资料核对一遍，标出资料中找不到依据的内容和对不上的 [n] 引用；
    # 在回答显示完之后进行（约 3~5 秒），不影响阅读，每个问题多一次 DeepSeek 调用
    verify-answers: true
    # 汇总类问题的参考资料字数预算，比普通问题大，资料多了回答会慢一些
    aggregate-context-chars: 24000
    # 命中片段所属的小文档（合同、手册、证件）整篇交给模型，读完全文再推理；按排名依次取，全文字数累计不超过这个值，
    # 几十万字的书仍只给命中片段。单独计算，不占上面两个预算。0 表示不读全文
    full-text-chars: 40000
